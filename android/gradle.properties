org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for "Could not connect to Kotlin compile daemon / Access is denied":
# compile Kotlin in-process instead of launching a separate daemon java.exe.
kotlin.compiler.execution.strategy=in-process
# Workaround for "Could not close incremental caches ... different roots"
# (project on D: drive, pub cache on C: drive): disable Kotlin incremental.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
