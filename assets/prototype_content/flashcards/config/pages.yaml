# Source-page configuration for the Santali visual vocabulary dataset.
#
# Every item lists, in reading order (row by row, left to right):
#   en      English gloss exactly as printed in the book (typos kept - this is source truth)
#   hi      Hindi gloss as printed (read from the rendered page; the PDF text layer
#           stores Hindi in legacy KrutiDev encoding, so it is not machine-readable)
#   concept normalized concept used for IDs / retrieval (lower_snake_case)
#   note    optional: explains any difference between the printed label and the concept
#   visual_type  optional per-item override of the page default
#
# Santali labels are NOT listed here: they are pulled from the PDF text layer and
# cropped from the rendered page, then left unverified for human review.

source:
  pdf: "source/Aao Santali Likhna Sikhe.pdf"
  title: "Aao Santali Likhna Sikhe (ᱜᱤᱫᱽᱨᱟᱹ ᱜᱟᱛᱮᱜ ᱯᱩᱛᱷᱤ)"
  render_dpi: 300

# Images that are drawn on the page but are not flashcard items
# (hidden duplicates underneath another photo, drop shadows).
drop_xrefs:
  11: [151]   # larger jasmine raster hidden underneath the visible one
  18: [334]   # drop-shadow image behind the WHITE swatch

min_image_size_pt: 20

