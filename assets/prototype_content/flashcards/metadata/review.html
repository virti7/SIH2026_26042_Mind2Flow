<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santali Asset Review</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe3ee;--blue:#1e5aa8;--amber:#f59e0b;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:2;background:var(--blue);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin:0 12px 0 0}header select,header input,header button{font:inherit;padding:5px 8px;border-radius:6px;border:0}
header button{background:var(--amber);color:#1f2937;font-weight:600;cursor:pointer}#stats{margin-left:auto;font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.ok{border-color:var(--green);box-shadow:0 0 0 2px #15803d22}.card.bad{border-color:var(--red)}
.src{height:190px;display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:8px}
.src img{max-width:100%;max-height:190px}.lbl{height:44px;display:flex;justify-content:center}.lbl img{max-height:44px}
.id{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}.row{display:flex;gap:8px;align-items:center}
.row label{width:84px;color:var(--muted);font-size:12px;flex:none}.row input{flex:1;min-width:0;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.santali{font-family:"Nirmala UI","Noto Sans Ol Chiki",sans-serif;font-size:18px}
.note{font-size:12px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 6px}
.btns{display:flex;gap:6px}.btns button{flex:1;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btns .v{border-color:var(--green);color:var(--green)}.btns .r{border-color:var(--red);color:var(--red)}
.flag{font-size:11px;color:var(--amber);font-weight:600}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#111827;--ink:#e5e7eb;--muted:#9ca3af;--line:#334155}.src{background:#fff}.btns button,.row input{background:#1f2937;color:var(--ink)}}
</style></head><body>
<header><h1>Santali Asset Review</h1>
<select id="cat"><option value="">All categories</option></select>
<select id="st"><option value="">All statuses</option><option>pending</option><option>verified</option><option>rejected</option></select>
<input id="q" placeholder="search id / english">
<button id="exp">Export CSV</button><span id="stats"></span></header>
<main id="grid"></main>

const KEY = "santali-review-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cats = [...new Set(ASSETS.map(a => a.subcategory || a.category))];
cats.forEach(c => cat.insertAdjacentHTML("beforeend", `<option>${c}</option>`));

function render() {
  const c = cat.value, s = document.getElementById("st").value, query = q.value.toLowerCase();
  grid.innerHTML = "";
  let done = 0;
  ASSETS.forEach(a => { if ((st(a.id).status || "pending") !== "pending") done++; });
  stats.textContent = `${done} / ${ASSETS.length} reviewed`;
  ASSETS.filter(a => (!c || (a.subcategory || a.category) === c)
      && (!s || (st(a.id).status || "pending") === s)
      && (!query || a.id.includes(query) || a.english.includes(query))).forEach(a => {
    const r = st(a.id), status = r.status || "pending";
    const el = document.createElement("div");
    el.className = "card" + (status === "verified" ? " ok" : status === "rejected" ? " bad" : "");
    el.innerHTML = `
      <div class="id">${a.id} · p.${a.page}</div>
      <div class="src"><img loading="lazy" src="../${a.source_crop}" alt="${esc(a.english)}"></div>
      ${a.label_image ? `<div class="lbl"><img loading="lazy" src="../${a.label_image}" alt="printed Santali"></div>` : ""}
      ${a.incomplete ? `<div class="flag">Text-layer candidate looks truncated - type it from the printed word</div>` : ""}
      <div class="row"><label>Category</label><input data-f="category" value="${esc(r.category ?? (a.subcategory || a.category))}"></div>
      <div class="row"><label>English</label><input data-f="english" value="${esc(r.english ?? a.english)}"></div>
      <div class="row"><label>Santali</label><input class="santali" data-f="santali" value="${esc(r.santali ?? a.santali ?? "")}"></div>
      <div class="row"><label>Book said</label><span>${esc(a.source_english)} / ${esc(a.hindi || "")}</span></div>
      ${a.notes ? `<div class="note">${esc(a.notes)}</div>` : ""}
      <div class="row"><label>Notes</label><input data-f="notes" value="${esc(r.notes ?? "")}"></div>
      <div class="btns"><button class="v">✓ Verify</button><button class="r">✗ Reject</button><button class="p">Reset</button></div>`;
    el.querySelectorAll("input").forEach(i => i.addEventListener("change", () => {
      state[a.id] = {...st(a.id), [i.dataset.f]: i.value}; save();
    }));
    el.querySelector(".v").onclick = () => { state[a.id] = {...st(a.id), status: "verified"}; save(); render(); };
    el.querySelector(".r").onclick = () => { state[a.id] = {...st(a.id), status: "rejected"}; save(); render(); };
    el.querySelector(".p").onclick = () => { delete state[a.id]; save(); render(); };
    grid.appendChild(el);
  });
}
function exportCsv() {
  const rows = [["id","status","category","english","santali","notes"]];
  ASSETS.forEach(a => { const r = st(a.id);
    rows.push([a.id, r.status || "pending", r.category ?? (a.subcategory || a.category), r.english ?? a.english,
               r.santali ?? a.santali ?? "", r.notes ?? ""]); });
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
  link.download = "review_export.csv"; link.click();
}
[cat, document.getElementById("st")].forEach(e => e.onchange = render);
q.oninput = render; exp.onclick = exportCsv;
render();
